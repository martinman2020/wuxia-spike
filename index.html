<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spike 001 — 武學對招 core loop (v2.2 角色演出)</title>
<style>
  :root { --ink:#2b2b2b; --paper:#f6f4ef; --line:#c9c2b6; --accent:#7a2f2f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family: ui-serif, "Noto Serif TC", "Songti TC", serif; font-size:15px; }
  #app { max-width:880px; margin:0 auto; padding:18px 16px 60px; }
  h1 { font-size:17px; margin:0 0 2px; letter-spacing:2px; }
  .sub { font-size:12px; color:#7c7469; margin-bottom:14px; }
  .panel { border:1px solid var(--line); background:#fffefb; padding:12px 14px; margin-bottom:12px; }
  .enemy { border-left:4px solid var(--accent); }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .name { font-weight:700; letter-spacing:1px; }
  .intent { font-size:13px; color:var(--accent); }
  .stat { font-size:13px; }
  .ban { font-size:12px; color:var(--accent); border:1px dashed var(--accent); padding:1px 6px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:8px; margin:10px 0 14px; }
  .card { border:1px solid var(--line); background:#fffefb; padding:8px 9px; cursor:pointer; text-align:left; font:inherit; }
  .card:hover:not(:disabled) { border-color:var(--accent); }
  .card:disabled { opacity:.42; cursor:default; }
  .card .cost { float:right; font-size:12px; border:1px solid var(--line); padding:0 5px; }
  .card .cname { font-weight:700; }
  .card .ctype { font-size:11px; color:#8a8277; }
  .card .ctext { font-size:12px; color:#5f584e; line-height:1.35; margin-top:3px; }
  .banned { border-color:var(--accent); background:#fbf1ef; }
  button.act { font:inherit; padding:7px 14px; border:1px solid var(--ink); background:#fffefb; cursor:pointer; }
  button.act:hover { background:#efece5; }
  #log { font-size:12.5px; line-height:1.5; max-height:150px; overflow:auto; color:#4b453c; }
  .hint { font-size:11.5px; color:#8a8277; margin-top:10px; }
  .big { font-size:19px; font-weight:700; }
  /* ── 美術層（spike 002/003）── */
  #bgLayer { position:fixed; inset:0; z-index:-1; background:#f4f1e8 center/cover no-repeat;
             opacity:.55; pointer-events:none; }
  #styleBar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:8px 10px; }
  #styleBar button { font:inherit; font-size:12.5px; padding:4px 10px; border:1px solid var(--line); background:#fffefb; cursor:pointer; }
  #styleBar button.on { background:var(--ink); color:#fffefb; border-color:var(--ink); }
  #styleBar .note { font-size:11px; color:#8a8277; }
  .thumb { height:96px; margin:-3px -4px 7px; overflow:hidden; border-bottom:1px solid var(--line); background:#f1eee6; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .portrait { width:88px; height:88px; overflow:hidden; flex:0 0 88px; border:1px solid var(--line); }
  .portrait img { width:100%; height:100%; object-fit:cover; display:block; }
  .enemy-top { display:flex; gap:12px; align-items:center; }
  body.artA { background:#f4f1e8; }
  body.artB { background:#efe9dd; }
  body.artC { background:#f7f7f4; }
  body.artA .card, body.artB .card, body.artC .card { transition:transform .08s ease, box-shadow .12s ease; }
  body.artA .card:hover:not(:disabled), body.artB .card:hover:not(:disabled), body.artC .card:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 3px 8px rgba(0,0,0,.12); }
  .card:active:not(:disabled) { transform:scale(.97); }
  /* ── 打擊動畫 ── */
  @keyframes shakeX { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
  .shake { animation:shakeX .3s ease-in-out; }
  @keyframes slashSweep { 0%{opacity:0;transform:translate(-14px,-10px) rotate(-18deg) scaleX(.4)} 25%{opacity:.95} 100%{opacity:0;transform:translate(14px,10px) rotate(-18deg) scaleX(1.35)} }
  .fx-slash { position:fixed; pointer-events:none; z-index:60;
    background:linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.92) 46%, rgba(122,47,47,.85) 51%, rgba(255,255,255,0) 60%);
    animation:slashSweep .42s ease-out forwards; }
  @keyframes floatUp { 0%{opacity:0;transform:translateY(6px) scale(.8)} 20%{opacity:1;transform:translateY(-4px) scale(1.15)} 100%{opacity:0;transform:translateY(-42px) scale(1)} }
  .fx-num { position:fixed; z-index:70; font-weight:700; font-size:22px; pointer-events:none;
    text-shadow:0 1px 3px rgba(255,255,255,.95); animation:floatUp 1s ease-out forwards; }
  @keyframes ghostFly { 0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)} 100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(-14deg) scale(.42)} }
  .fx-ghost { position:fixed; z-index:65; pointer-events:none; border:1px solid var(--accent); background:#fffefb;
    animation:ghostFly .38s ease-in forwards; overflow:hidden; }
  .fx-ghost img { width:100%; height:100%; object-fit:cover; }
  @keyframes vignette { 0%{opacity:0} 25%{opacity:.5} 100%{opacity:0} }
  .fx-vig { position:fixed; inset:0; z-index:55; pointer-events:none;
    background:radial-gradient(circle at 50% 45%, rgba(255,255,255,0) 35%, rgba(122,47,47,.55) 100%);
    animation:vignette .5s ease-out forwards; }
  @keyframes blockPulse { 0%{background:#eef3ee} 100%{background:#fffefb} }
  .blocked { animation:blockPulse .5s ease-out; }
  /* ── 演出型打擊（技能 cut-in / 鏡頭 / 衝擊幀 / 粒子）── */
  /* ── 角色打擊演出（把 spike 004/005 嘅 2D 骨架搬入遊戲）── */
  #stageFx { position:fixed; inset:0; z-index:90; display:none;
    background:radial-gradient(120% 90% at 58% 38%, rgba(30,26,22,.78) 0%, rgba(14,12,10,.94) 100%); }
  #stageFx.on { display:block; }
  #stageInner { position:absolute; width:760px; height:900px; transform-origin:0 0; }
  #stageRig { position:absolute; left:0; top:0; width:465px; height:882px; }
  #stageRig img { position:absolute; display:block; transform-origin:var(--ox,50%) var(--oy,50%);
    will-change:transform; }
  #stageRig img.ghostArm { opacity:.28; filter:blur(2px); display:none; }
  #stageFx.go #stageRig img.ghostArm { display:block; animation:armThrust .95s cubic-bezier(.3,.7,.2,1) 60ms both; }
  #stageInner.go { animation:rootLunge .95s cubic-bezier(.35,.8,.3,1) both; }
  #stageInner.go #stageRig .p-arm   { animation:armThrust .95s cubic-bezier(.3,.7,.2,1) both; }
  #stageInner.go #stageRig .p-torso { animation:torsoLean .95s ease-in-out both; }
  #stageInner.go #stageRig .p-head  { animation:headTurn  .95s ease-in-out both; }
  @keyframes armThrust {
    0% { transform:rotate(0) } 17% { transform:rotate(-27deg) translateX(-6px) }
    34% { transform:rotate(15deg) translateX(14px) } 45% { transform:rotate(15deg) translateX(14px) }
    62% { transform:rotate(6deg) translateX(4px) } 100% { transform:rotate(0) } }
  @keyframes torsoLean {
    0% { transform:rotate(0) } 17% { transform:rotate(-5deg) } 34% { transform:rotate(7deg) }
    45% { transform:rotate(7deg) } 62% { transform:rotate(3deg) } 100% { transform:rotate(0) } }
  @keyframes headTurn {
    0% { transform:rotate(0) } 17% { transform:rotate(-4deg) } 34% { transform:rotate(3deg) }
    62% { transform:rotate(1deg) } 100% { transform:rotate(0) } }
  @keyframes rootLunge {
    0% { transform:translateX(0) } 17% { transform:translateX(-10px) } 34% { transform:translateX(30px) }
    45% { transform:translateX(30px) } 62% { transform:translateX(10px) } 100% { transform:translateX(0) } }
  .s-slash { position:absolute; z-index:3; pointer-events:none; mix-blend-mode:screen;
    background:linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,252,244,.95) 50%, rgba(255,255,255,0) 62%);
    animation:sSlash .3s ease-out forwards; }
  @keyframes sSlash { 0%{ transform:translateX(-46%) scaleX(.7); opacity:0 }
    25%{ opacity:1 } 100%{ transform:translateX(46%) scaleX(1.15); opacity:0 } }
  .s-dmg { position:absolute; z-index:4; font-weight:700; font-size:38px; color:#ffd9c9;
    text-shadow:0 3px 12px rgba(0,0,0,.75); animation:floatUp 1.1s ease-out forwards; }
  .s-num { position:absolute; z-index:4; font-weight:700; font-size:30px; color:#bfe3c4;
    text-shadow:0 3px 12px rgba(0,0,0,.7); animation:floatUp 1.1s ease-out forwards; }
  @keyframes floatUp { 0%{opacity:0;transform:translateY(10px) scale(.7)}
    22%{opacity:1;transform:translateY(-8px) scale(1.22)} 100%{opacity:0;transform:translateY(-64px) scale(1)} }
  .s-ink { position:absolute; z-index:4; border-radius:50%; background:#efe7d8; pointer-events:none;
    animation:inkFly2 .6s ease-out forwards; }
  @keyframes inkFly2 { 0%{opacity:.95;transform:translate(0,0) scale(1)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)} }
  .s-hit { animation:dummyHit .42s ease-out; }
  @keyframes dummyHit { 0%{transform:translateX(0)} 30%{transform:translateX(18px) rotate(4deg)}
    100%{transform:translateX(0)} }
  #stageTip { position:absolute; bottom:14px; width:100%; text-align:center; color:#c9c0b2;
    font-size:12px; letter-spacing:1px; }
  #app { transition:transform .18s ease-out; }
  #app.camerapush { transform:scale(1.05) translateY(7px); }
  @keyframes flashOut { 0%{opacity:.9} 100%{opacity:0} }
  .fx-flash { position:fixed; inset:0; z-index:78; background:#fffefb; pointer-events:none;
    animation:flashOut .19s steps(2, end) forwards; }
  @keyframes cutinIn { 0%{opacity:0} 12%{opacity:1} 72%{opacity:1} 100%{opacity:0} }
  .cutin { position:fixed; inset:0; z-index:80; pointer-events:none; background:rgba(18,15,12,.62);
    display:flex; align-items:center; justify-content:center; animation:cutinIn .62s ease-out forwards; }
  @keyframes artPush { 0%{transform:translateX(-16%) scale(.9)} 22%{transform:translateX(0) scale(1)} 100%{transform:translateX(7%) scale(1.07)} }
  .cutin img { max-height:60vh; max-width:76vw; animation:artPush .62s ease-out forwards;
    filter:drop-shadow(0 8px 22px rgba(0,0,0,.55)); }
  .cutin .cutin-name { position:absolute; bottom:11%; font-size:30px; letter-spacing:8px; color:#fffefb;
    text-shadow:0 2px 12px #000, 0 0 3px #000; font-weight:700; }
  @keyframes inkFly { 0%{opacity:1;transform:translate(0,0) scale(1)} 100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)} }
  .ink-p { position:fixed; z-index:72; pointer-events:none; border-radius:50%; background:#1b1917;
    animation:inkFly .52s ease-out forwards; }
  .fx-enemy-hit { filter:brightness(1.45) contrast(1.15); }
  .fx-enemy-move { transform:translateY(5px) scale(.985); transition:transform .12s ease-out; }
  .fx-heal-glow { box-shadow:0 0 0 2px rgba(63,107,70,.45) inset; }
</style>
</head>
<body>
<!-- 角色打擊演出層（部件由 art/rig/rig-data.json 動態砌，見 loadRig()） -->
<div id="stageFx">
  <div id="stageInner">
    <div id="stageRig">
      <img class="ghostArm" id="srGhost" alt="">
      <img class="p-legs"  id="srLegs"  alt="">
      <img class="p-arm"   id="srArm"   alt="">
      <img class="p-torso" id="srTorso" alt="">
      <img class="p-head"  id="srHead"  alt="">
    </div>
    <img id="stageEnemy" alt="" style="position:absolute; left:486px; top:250px; width:240px; opacity:.92;">
  </div>
  <div id="stageTip">點畫面跳過演出</div>
</div>
<div id="bgLayer"></div>
<div id="app">
  <h1>武學對招 — Spike 001 v2.2（角色演出）</h1>
  <div class="sub">build 2026-09-26a ・ 出攻擊牌會觸發全屏角色演出（每回合第一次）｜亦可按「▶ 試演出」即刻睇 ・ <a href="./docs.html" style="color:#7a2f2f">機制與數值文檔 →</a></div>
  <div class="panel" id="styleBar"></div>
  <div id="meta" class="panel"></div>
  <div id="enemy" class="panel enemy"></div>
  <div id="me" class="panel"></div>
  <div id="hand" class="cards"></div>
  <div class="row">
    <button class="act" id="endTurn">結束回合（空白鍵）</button>
    <button class="act" id="restart">重開一局（R）</button>
  </div>
  <div class="panel" style="margin-top:12px"><div id="log"></div></div>
  <div class="hint">按 1–9 出招。重點觀察：亂按會唔會輸、被迫換招時有冇回報。</div>
</div>
<script>
// ── 招式表 ──
// type：劍 / 掌 / 腿 / 內功 —— 「江湖記憶」以類型為單位破招
const CARDS = {
  zhijian:  { name:'直刺',      type:'劍',   cost:1, text:'造成 8 點傷害',                     fx:(c)=>{ hurt(c,8); } },
  hengsao:  { name:'橫掃',      type:'劍',   cost:1, text:'造成 5 點傷害，並使敵人流血 4',      fx:(c)=>{ hurt(c,5); c.bleed += 4; } },
  lianhuan: { name:'連環腿',    type:'腿',   cost:1, text:'造成 5 點傷害 2 次',                 fx:(c)=>{ hurt(c,5); hurt(c,5); } },
  dianxue:  { name:'點穴',      type:'腿',   cost:1, text:'造成 7 點傷害，敵人軟弱 1 回合',     fx:(c)=>{ hurt(c,7); c.weak = Math.max(c.weak,1); } },
  poshi:    { name:'破勢',      type:'掌',   cost:2, text:'造成 18 點傷害，自身受 5 點傷害',    fx:(c)=>{ hurt(c,18); S.hp -= 5; log('破勢反噬，自身受 5 點傷害'); } },
  tuishou:  { name:'推手',      type:'掌',   cost:1, text:'獲得 6 點護體',                      fx:()=>{ S.block += 6; } },
  tuna:     { name:'吐納',      type:'內功', cost:0, text:'抽 1 張牌',                          fx:()=>{ draw(1); } },
  yangqi:   { name:'養氣',      type:'內功', cost:1, text:'獲得 1 點氣，抽 1 張牌',             fx:()=>{ S.energy += 1; draw(1); } },
  yunqi:    { name:'運氣療傷',  type:'內功', cost:1, text:'護體 4，回復 3 點生命',              fx:()=>{ S.block += 4; S.hp = Math.min(S.maxHp, S.hp+3); } },
};
const START_DECK = ['zhijian','zhijian','zhijian','tuishou','tuishou','tuna','lianhuan','dianxue','yunqi','poshi','hengsao','yangqi'];
const ENEMIES = [
  { name:'山賊',   hp:44, hits:2, dmg:7,  note:'兩連擊，護體會被拆開' },
  { name:'鏢師',   hp:56, hits:2, dmg:8,  note:'兩連擊，攻高血厚' },
  { name:'掌門',   hp:68, hits:2, dmg:10, note:'兩連擊，蓄勢時每擊加倍' },
];
const KEY = 'wuxia_spike_001_stats_v2';

// ── 江湖記憶（跨局）：上局最常用「招式類型」被破招 ──
let meta = load();
function load(){
  try { const m = JSON.parse(localStorage.getItem(KEY)); if (m && typeof m.runs === 'number') return m; } catch(e){}
  return { runs:0, wins:0, typeUses:{}, ban:null };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(meta)); } catch(e){} }

let S = null, drawPile = [], LOG = [];
function newRun(){
  LOG = [];
  S = { hp:60, maxHp:60, energy:0, energyMax:3, block:0, turn:0,
        hand:[], discard:[], uses:{}, typeUses:{}, enemy:null, idx:0, over:false };
  drawPile = shuffle(START_DECK.slice());
  log('— 新局開始 —');
  if (meta.ban) log(`江湖記憶：你上局最常用【${meta.ban}】，本局${meta.ban}類招式效果 −30%`);
  startFight(0);
}
function startFight(i){
  const base = ENEMIES[i];
  S.idx = i;
  S.enemy = { name: base.name, hp: base.hp, maxHp: base.hp, dmg: base.dmg, hits: base.hits || 1,
              bleed:0, weak:0, charged:false, note: base.note };
  S.block = 0;
  log(`遇上【${base.name}】(${base.note})`);
  playerTurnStart();
}
function playerTurnStart(){
  S.turn++;
  S.energy = S.energyMax;
  S.block = 0;
  S.typesThisTurn = new Set();
  const e = S.enemy;
  if (e.name === '掌門' && e.hp > e.maxHp/2 && !e.charged && Math.random() < .5) e.charged = true;
  else if (e.weak > 0) e.weak--;
  draw(7);
  render();
}
function draw(n){
  for (let i=0;i<n;i++){
    if (S.hand.length >= 10) return;
    if (drawPile.length === 0){
      if (S.discard.length === 0) return;
      drawPile = shuffle(S.discard); S.discard = [];
      log('洗牌：棄牌堆回到武學譜');
    }
    S.hand.push(drawPile.pop());
  }
}

// ── 行動 ──
function isBanned(type){ return !!type && meta.ban === type; }
function hurt(c, dmg){
  const t = S.lastType;
  let note = '';
  if (isBanned(t)) { dmg = Math.max(1, Math.round(dmg*0.7)); note += '（被破招）'; }
  if (S.typesThisTurn && S.typesThisTurn.size >= 2) { dmg = Math.round(dmg*1.25); note += '（變招 +25%）'; }
  c.hp -= dmg;
  log(`對【${c.name}】造成 ${dmg} 點傷害${note}`);
  if (c.hp <= 0) victory();
}
function playCard(i){
  if (!S || S.over) return;
  const id = S.hand[i]; if (!id) return;
  const card = CARDS[id];
  if (S.energy < card.cost) { log(`氣不足，無法施展【${card.name}】`); return; }
  const handEl = document.getElementById('hand');
  const btn = (handEl && handEl.children) ? handEl.children[i] : null;
  const en = S.enemy, hpBefore = en ? en.hp : 0, blockBefore = S.block, myHpBefore = S.hp;
  S.energy -= card.cost;
  S.hand.splice(i,1); S.discard.push(id);
  S.uses[id] = (S.uses[id]||0)+1;
  S.typeUses[card.type] = (S.typeUses[card.type]||0)+1;
  S.lastType = card.type;
  S.typesThisTurn.add(card.type);
  log(`施展【${card.name}】（${card.type}）`);
  card.fx(S.enemy);
  S.lastType = null;
  // ── 打擊動畫 ──
  fxGhost(btn, id);
  const dealt = hpBefore - Math.max(0, en ? en.hp : 0);
  const gainedBlock = S.block - blockBefore;
  const healed = S.hp - myHpBefore;
  setTimeout(() => {
    if (dealt > 0){ fxAttack(id, card.name, dealt); }
    if (gainedBlock > 0) fxNum('+' + gainedBlock + ' 護體', '#3f6b46', false);
    if (healed > 0) fxNum('+' + healed, '#3f6b46', false);
  }, 130);
  if (S.hp <= 0) { defeat(); return; }
  render();
}
function endTurn(){
  if (!S || S.over) return;
  S.discard.push(...S.hand); S.hand = [];
  const c = S.enemy;
  if (c.hp <= 0) return;
  if (c.bleed > 0){ c.hp -= c.bleed; log(`【${c.name}】流血受 ${c.bleed} 點傷害`); c.bleed = Math.floor(c.bleed/2); if (c.hp <= 0){ victory(); return; } }
  let base = c.dmg;
  if (c.charged){ base *= 2; c.charged = false; log(`【${c.name}】蓄勢爆發！`); }
  if (c.weak > 0) base = Math.round(base*0.75);
  const hits = c.hits || 1;
  let totalDealt = 0, totalBlocked = 0, detail = [];
  for (let h=0; h<hits; h++){
    const absorbed = Math.min(S.block, base);
    S.block -= absorbed;
    const dealt = base - absorbed;
    S.hp -= dealt;
    totalDealt += dealt; totalBlocked += absorbed;
    detail.push(`${base}${absorbed ? `(擋${absorbed})` : ''}`);
    if (S.hp <= 0) break;
  }
  log(`【${c.name}】${hits}連擊 ${detail.join(' + ')}：共扣 ${totalDealt} 點（護體擋 ${totalBlocked}）`);
  fxVignette();
  fxShake(document.getElementById('me'));
  const meEl = document.getElementById('me');
  if (meEl && meEl.classList && totalBlocked > 0){
    meEl.classList.add('blocked');
    setTimeout(() => meEl.classList.remove('blocked'), 520);
  }
  if (totalDealt > 0) fxNum('-' + totalDealt, '#a33', false);
  if (S.hp <= 0){ defeat(); return; }
  playerTurnStart();
}
function victory(){
  log(`擊敗【${S.enemy.name}】`);
  if (S.idx + 1 < ENEMIES.length){
    S.hp = Math.min(S.maxHp, S.hp + 5);
    log('短暫調息：回復 5 點生命');
    startFight(S.idx+1);
  }
  else endRun(true);
}
function defeat(){ log('你倒下了。'); endRun(false); }
function endRun(win){
  S.over = true;
  meta.runs++; if (win) meta.wins++;
  const top = topType(S.typeUses);
  meta.ban = top;
  for (const k in S.typeUses) meta.typeUses[k] = (meta.typeUses[k]||0) + S.typeUses[k];
  save();
  log(`— 本局結束（${win?'勝':'敗'}）｜你最常用【${top||'—'}】，下一局${top||''}類招式會被破招 —`);
  render();
}
function topType(u){ let b=null,n=0; for (const k in u) if (u[k]>n){ n=u[k]; b=k; } return b; }

// ── 美術層（spike 002）：同一張圖用唔同裁切做測試，未生成正式牌圖 ──
const ART_STYLES = [
  { id:'none', label:'無美術' },
  { id:'A',    label:'水墨' },
  { id:'B',    label:'木刻' },
  { id:'C',    label:'平面' },
];
const CARD_CROP = { zhijian:'18% 12%', hengsao:'62% 26%', lianhuan:'34% 78%', dianxue:'50% 20%',
                    poshi:'70% 55%', tuishou:'44% 48%', tuna:'26% 62%', yangqi:'78% 74%', yunqi:'52% 88%' };
const ENEMY_CROP = { '山賊':'16% 26%', '鏢師':'56% 38%', '掌門':'84% 16%' };
const ENEMY_FILE = { '山賊':'shanzei', '鏢師':'biaoshi', '掌門':'zhangmen' };
const FULL_SET = ['A'];   // 只有水墨有全套正式素材；B/C 暫時用單張圖裁切
let artStyle = 'none';
try { artStyle = localStorage.getItem('wuxia_art_style') || 'none'; } catch(e){}
function saveArt(){ try { localStorage.setItem('wuxia_art_style', artStyle); } catch(e){} }
function artOn(){ return artStyle !== 'none'; }
function artFull(){ return FULL_SET.includes(artStyle); }
function artURL(){ return './art/style' + artStyle + '.webp'; }
function cardArtURL(id){ return artFull() ? './art/A/' + id + '.webp' : artURL(); }
function enemyArtURL(name){ return artFull() ? './art/A/enemy-' + (ENEMY_FILE[name]||'shanzei') + '.webp' : artURL(); }

function renderStyleBar(){
  const bar = document.getElementById('styleBar');
  bar.innerHTML = '';
  bar.children.length = 0;
  const lab = document.createElement('span');
  lab.className = 'note'; lab.textContent = '美術風格：';
  bar.appendChild(lab);
  for (const s of ART_STYLES){
    const b = document.createElement('button');
    b.textContent = s.label + (FULL_SET.includes(s.id) ? '' : '（試）');
    b.className = (artStyle === s.id ? 'on' : '');
    b.onclick = () => { artStyle = s.id; saveArt(); applyArt(); render(); };
    bar.appendChild(b);
  }
  const n = document.createElement('span');
  n.className = 'note';
  n.textContent = artFull() ? '（水墨：正式牌圖 + 敵人圖 + 背景 + 打擊演出）'
                            : (artOn() ? '（測試用：單張圖裁切，未有正式牌圖）' : '（切換睇下邊種風格順眼）');
  bar.appendChild(n);
  const ab = document.createElement('button');
  ab.textContent = '演出：' + (animFull ? '全開' : '精簡');
  ab.onclick = () => { animFull = !animFull; saveAnim(); render(); };
  bar.appendChild(ab);
  const tb = document.createElement('button');
  tb.textContent = '▶ 試演出';
  tb.onclick = () => {
    const en = S && S.enemy;
    const n = en ? Math.max(1, Math.round((en.maxHp || 40) * 0.2)) : 8;
    fxAttack('zhijian', '直刺', n, true);          // 強制演出，唔理「精簡」設定
  };
  bar.appendChild(tb);
}
function applyArt(){
  if (document.body) document.body.className = artOn() ? 'art' + artStyle : '';
  const bg = document.getElementById('bgLayer');
  if (bg && bg.style) bg.style.backgroundImage = artFull() ? `url('./art/A/bg.webp')` : 'none';
}

// ── 打擊動畫（瀏覽器限定；無 DOM 嘅環境會自動 no-op）──
function fxReady(){
  const el = document.getElementById('enemy');
  return !!(el && typeof el.getBoundingClientRect === 'function' && document.body && document.body.appendChild);
}
function fxTemp(cls, css, life){
  const d = document.createElement('div');
  d.className = cls;
  for (const k in css) d.style[k] = css[k];
  document.body.appendChild(d);
  setTimeout(() => { if (d.remove) d.remove(); }, life);
  return d;
}
function fxSlash(){
  if (!fxReady()) return;
  const r = document.getElementById('enemy').getBoundingClientRect();
  fxTemp('fx-slash', { left:(r.left-16)+'px', top:(r.top-10)+'px', width:(r.width+32)+'px', height:(r.height+20)+'px' }, 460);
}
function fxNum(text, color, nearEnemy){
  if (!fxReady()) return;
  const r = (nearEnemy ? document.getElementById('enemy') : document.getElementById('me')).getBoundingClientRect();
  const d = fxTemp('fx-num', { left:(r.left + r.width*0.55)+'px', top:(r.top + 8)+'px', color:color||'#7a2f2f' }, 1050);
  d.textContent = text;
}
function fxGhost(btn, id){
  if (!fxReady() || !btn || typeof btn.getBoundingClientRect !== 'function') return;
  const a = btn.getBoundingClientRect(), b = document.getElementById('enemy').getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'fx-ghost';
  d.style.left = a.left+'px'; d.style.top = a.top+'px';
  d.style.width = Math.min(90, a.width)+'px'; d.style.height = Math.min(110, a.height)+'px';
  d.style.setProperty('--dx', (b.left + b.width/2 - a.left - 45)+'px');
  d.style.setProperty('--dy', (b.top + b.height/2 - a.top - 55)+'px');
  d.innerHTML = `<img src="${cardArtURL(id)}" alt="">`;
  document.body.appendChild(d);
  setTimeout(() => { if (d.remove) d.remove(); }, 420);
}
function fxShake(el){
  if (!fxReady() || !el || !el.classList) return;
  el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 320);
}
function fxVignette(){
  if (!fxReady()) return;
  fxTemp('fx-vig', {}, 520);
}

// ── 角色打擊演出（2D 骨架，數值來自 art/rig/rig-data.json，同 spike 004/005 同源）──
let rigReady = false, rigData = null, lastActTurn = -1;
const RIG_EXPECT = { head:[195,189], torso:[316,230], arm_front:[252,211], legs:[465,534] };

function loadRig(){
  if (typeof fetch !== 'function' || typeof window === 'undefined' || !document.body) return;    // sim / 無 DOM 環境直接跳過
  fetch('./art/rig/rig-data.json?v=2').then(r => r.json()).then(d => {
    rigData = d;
    const stage = d.stage, piv = d.pivot;
    const el = { legs:'srLegs', arm_front:'srArm', torso:'srTorso', head:'srHead' };
    for (const name in d.parts){
      const p = d.parts[name], img = document.getElementById(el[name]);
      if (!img) continue;
      img.src = './art/rig/' + p.file;
      img.style.left = p.box[0] + 'px';
      img.style.top  = p.box[1] + 'px';
      img.style.zIndex = p.z;
      const pv = piv[name];
      if (pv){
        const ox = pv[0]*stage[0] - p.box[0], oy = pv[1]*stage[1] - p.box[1];
        img.style.setProperty('--ox', ox + 'px');
        img.style.setProperty('--oy', oy + 'px');
      }
      img.onload = () => {   // 護欄：素材換過就出聲，唔會靜靜地爆位
        const want = RIG_EXPECT[name];
        if (want && (img.naturalWidth !== want[0] || img.naturalHeight !== want[1]))
          console.warn('rig 部件尺寸同 rig-data.json 唔一致：', name, img.naturalWidth, img.naturalHeight, want);
      };
    }
    const g = document.getElementById('srGhost');
    if (g && d.parts.arm_front){
      g.src = './art/rig/' + d.parts.arm_front.file;
      g.style.left = d.parts.arm_front.box[0] + 'px';
      g.style.top  = d.parts.arm_front.box[1] + 'px';
      g.style.zIndex = 1;
      const pv = piv['arm_front'];
      if (pv){
        g.style.setProperty('--ox', (pv[0]*stage[0] - d.parts.arm_front.box[0]) + 'px');
        g.style.setProperty('--oy', (pv[1]*stage[1] - d.parts.arm_front.box[1]) + 'px');
      }
    }
    rigReady = true;
  }).catch(() => { rigReady = false; });
}

function fitStage(){
  const wrap = document.getElementById('stageFx'), inner = document.getElementById('stageInner');
  if (!wrap || !inner || !wrap.clientWidth) return;
  const s = Math.min(wrap.clientWidth*0.96/760, wrap.clientHeight*0.62/900);
  inner.style.transform = 'scale(' + s + ')';
  inner.style.left = ((wrap.clientWidth - 760*s)/2) + 'px';
  inner.style.top  = ((wrap.clientHeight - 900*s)/2 + wrap.clientHeight*0.04) + 'px';
}

function stageFxNum(text, cls){
  const wrap = document.getElementById('stageFx'), enemy = document.getElementById('stageEnemy');
  if (!wrap || !enemy || !enemy.getBoundingClientRect) return;
  const r = enemy.getBoundingClientRect(), w = wrap.getBoundingClientRect();
  const d = document.createElement('div');
  d.className = cls; d.textContent = text;
  d.style.left = (r.left - w.left + r.width*0.34) + 'px';
  d.style.top  = (r.top - w.top + r.height*0.20) + 'px';
  wrap.appendChild(d);
  setTimeout(() => { if (d.remove) d.remove(); }, 1150);
}

function stageInk(){
  const wrap = document.getElementById('stageFx'), enemy = document.getElementById('stageEnemy');
  if (!wrap || !enemy || !enemy.getBoundingClientRect) return;
  const r = enemy.getBoundingClientRect(), w = wrap.getBoundingClientRect();
  const cx = r.left - w.left + r.width*0.36, cy = r.top - w.top + r.height*0.36;
  for (let i = 0; i < 16; i++){
    const a = Math.random()*Math.PI*2, dist = 34 + Math.random()*84, sz = 4 + Math.random()*9;
    const d = document.createElement('div');
    d.className = 's-ink';
    d.style.cssText = `left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;`
      + `--dx:${(Math.cos(a)*dist).toFixed(0)}px;--dy:${(Math.sin(a)*dist).toFixed(0)}px`;
    wrap.appendChild(d);
    setTimeout(() => { if (d.remove) d.remove(); }, 650);
  }
  const sl = document.createElement('div');
  sl.className = 's-slash';
  sl.style.cssText = `left:${r.left - w.left}px;top:${r.top - w.top}px;width:${r.width}px;height:${r.height}px;`;
  wrap.appendChild(sl);
  setTimeout(() => { if (sl.remove) sl.remove(); }, 340);
}

// 攻擊卡：一次出招 → 角色演出（每回合只演第一次，之後用輕量版，免得刷手遊咁慢）
function fxAttack(id, name, dealt, force){
  const turn = S ? S.turn : 0;
  const useStage = dealt > 0 && rigReady && (force || (animFull && lastActTurn !== turn));
  if (!useStage){ if (dealt > 0) fxImpact(id, name, dealt); return; }
  if (!force) lastActTurn = turn;
  const wrap = document.getElementById('stageFx'), inner = document.getElementById('stageInner'),
        rig = document.getElementById('stageRig'), enemy = document.getElementById('stageEnemy');
  if (!wrap || !wrap.classList || !inner || !rig){ fxImpact(id, name, dealt); return; }
  fxBusy = true;
  if (S && S.enemy && enemy) enemy.src = './art/A/enemy-' + (ENEMY_FILE[S.enemy.name] || 'shanzei') + '.webp';
  fitStage();
  wrap.classList.add('on'); wrap.classList.add('go');
  inner.classList.remove('go'); rig.classList.remove('act');
  void inner.offsetWidth;                         // 強制 reflow，令動畫可以重播
  inner.classList.add('go');
  const end = () => {
    wrap.classList.remove('on'); wrap.classList.remove('go'); inner.classList.remove('go');
    document.getElementById('app').classList.remove('camerapush');
    fxBusy = false;
  };
  const guard = setTimeout(end, 1500);
  wrap.onclick = () => { clearTimeout(guard); end(); };   // 點畫面跳過
  setTimeout(() => { fxFlash(); document.getElementById('app').classList.add('camerapush'); }, 320);
  setTimeout(() => {
    stageInk();
    stageFxNum('-' + dealt, 's-dmg');
    if (enemy && enemy.classList){ enemy.classList.add('s-hit'); setTimeout(() => enemy.classList.remove('s-hit'), 440); }
    if (S && S.block > 0) stageFxNum('護體 ' + S.block, 's-num');
  }, 350);
  setTimeout(() => { if (enemy && enemy.classList){ enemy.classList.remove('s-hit'); } }, 800);
}

// ── 演出型打擊：衝擊幀 → 技能 cut-in → 鏡頭推 → 粒子 → 傷害數字 ──
let fxBusy = false;
let animFull = true;
try { animFull = (localStorage.getItem('wuxia_anim') || 'full') === 'full'; } catch(e){}
function saveAnim(){ try { localStorage.setItem('wuxia_anim', animFull ? 'full' : 'light'); } catch(e){} }
function fxFlash(){ if (!fxReady()) return; fxTemp('fx-flash', {}, 220); }
function fxCamera(on){
  const app = document.getElementById('app');
  if (!fxReady() || !app || !app.classList) return;
  if (on) app.classList.add('camerapush'); else app.classList.remove('camerapush');
}
function fxCutin(id, name){
  if (!fxReady()) return;
  const d = document.createElement('div');
  d.className = 'cutin';
  d.innerHTML = `<img src="${cardArtURL(id)}" alt=""><div class="cutin-name">${name}</div>`;
  document.body.appendChild(d);
  setTimeout(() => { if (d.remove) d.remove(); }, 660);
}
function fxParticles(){
  if (!fxReady()) return;
  const r = document.getElementById('enemy').getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for (let i = 0; i < 12; i++){
    const a = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 70, s = 5 + Math.random() * 9;
    fxTemp('ink-p', { left:(cx-6)+'px', top:(cy-6)+'px', width:s+'px', height:s+'px',
      '--dx':(Math.cos(a)*dist).toFixed(0)+'px', '--dy':(Math.sin(a)*dist).toFixed(0)+'px' }, 560);
  }
}
function fxEnemyHit(){
  const el = document.getElementById('enemy');
  if (!fxReady() || !el || !el.classList) return;
  el.classList.add('fx-enemy-hit', 'fx-enemy-move');
  setTimeout(() => el.classList.remove('fx-enemy-hit', 'fx-enemy-move'), 260);
}
function fxImpact(id, name, dealt){
  if (!fxReady()) return;
  if (fxBusy){ fxNum('-' + dealt, '#7a2f2f', true); return; }
  fxBusy = true;
  fxFlash();                                  // 衝擊幀（白閃 2 格）
  if (animFull){
    fxCamera(true);                           // 鏡頭推近
    fxCutin(id, name);                        // 技能演出插畫
  }
  setTimeout(() => { fxParticles(); fxEnemyHit(); fxNum('-' + dealt, '#7a2f2f', true); }, 140);
  setTimeout(() => { fxCamera(false); fxBusy = false; }, animFull ? 620 : 300);
}

// ── 畫面 ──
function render(){
  renderStyleBar();
  const e = S.enemy;
  document.getElementById('meta').innerHTML =
    `<div class="row"><span class="stat">局數 <b>${meta.runs}</b>　勝 <b>${meta.wins}</b></span>
     <span class="stat">江湖記憶：${meta.ban ? '<span class="ban">'+meta.ban+'類 −30%</span>' : '（未有記錄）'}</span></div>`;
  document.getElementById('enemy').innerHTML = e ?
    `<div class="enemy-top">
       ${artOn() ? `<div class="portrait"><img src="${enemyArtURL(e.name)}" ${artFull() ? '' : `style="object-position:${ENEMY_CROP[e.name]||'50% 50%'}"`} alt=""></div>` : ''}
       <div style="flex:1">
         <div class="row"><span class="name big">${e.name}</span><span class="stat">生命 ${Math.max(0,e.hp)} / ${e.maxHp}</span></div>
         <div class="row" style="margin-top:6px"><span class="intent">意圖：${e.hp<=0 ? '—' : (e.charged ? '蓄勢（每擊加倍）' : `${e.hits>1?e.hits+'連擊 ':''}攻擊 ${e.weak>0?Math.round(e.dmg*.75):e.dmg}`)}</span>
         <span class="stat">${e.bleed>0 ? '流血 '+e.bleed+'　' : ''}${e.weak>0 ? '軟弱 '+e.weak+' 回合' : ''}</span></div>
       </div>
     </div>` : '';
  document.getElementById('me').innerHTML =
    `<div class="row"><span class="name">你</span><span class="stat">生命 ${Math.max(0,S.hp)} / ${S.maxHp}　護體 ${S.block}　氣 ${S.energy} / ${S.energyMax}</span></div>
     <div class="row" style="margin-top:6px"><span class="stat">變招：本回合已用【${[...(S.typesThisTurn||[])].join('・') || '—'}】${(S.typesThisTurn&&S.typesThisTurn.size>=2) ? '<b>　傷害 +25%</b>' : '（混用 2 種招式類型即 +25% 傷害）'}</span></div>`;
  const hand = document.getElementById('hand');
  hand.innerHTML = ''; hand.children.length = 0;
  S.hand.forEach((id,i)=>{
    const c = CARDS[id];
    const b = document.createElement('button');
    b.className = 'card' + (isBanned(c.type) ? ' banned' : '');
    b.disabled = S.energy < c.cost || S.over || !S.enemy || S.enemy.hp <= 0;
    b.innerHTML = `${artOn() ? `<div class="thumb"><img src="${cardArtURL(id)}" ${artFull() ? '' : `style="object-position:${CARD_CROP[id]||'50% 50%'}"`} alt=""></div>` : ''}<span class="cost">氣 ${c.cost}</span><span class="cname">${c.name}</span> <span class="ctype">${c.type}</span>
                   <div class="ctext">${c.text}${isBanned(c.type) ? '<br><b>被破招 −30%</b>' : ''}</div>`;
    b.onclick = ()=>playCard(i);
    hand.appendChild(b);
  });
  const lg = document.getElementById('log');
  lg.innerHTML = LOG.slice(-40).map(l=>'· '+l).join('<br>');
  lg.scrollTop = lg.scrollHeight;
}
function log(s){ LOG.push(s); }
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

document.getElementById('endTurn').onclick = endTurn;
document.getElementById('restart').onclick = ()=>{ newRun(); render(); };
document.addEventListener('keydown', ev=>{
  if (ev.code === 'Space' || ev.key === 'Enter'){ ev.preventDefault(); endTurn(); }
  else if (ev.key === 'r' || ev.key === 'R'){ newRun(); render(); }
  else if (/^[1-9]$/.test(ev.key)) playCard(parseInt(ev.key,10)-1);
});
// 測試接口（sim 用）
window.spike = { get S(){ return S; }, playCard, endTurn, newRun, meta:()=>meta, CARDS,
                 resetMeta:()=>{ meta = { runs:0, wins:0, typeUses:{}, ban:null }; save(); },
                 setBan:(t)=>{ meta.ban = t; save(); render(); } };

newRun();
applyArt();
render();
loadRig();
if (typeof window !== 'undefined' && window.addEventListener)
  window.addEventListener('resize', () => { if (rigReady) fitStage(); });
</script>
</body>
</html>
