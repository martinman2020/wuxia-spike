<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spike 001 — 武學對招 core loop (v2)</title>
<style>
  :root { --ink:#2b2b2b; --paper:#f6f4ef; --line:#c9c2b6; --accent:#7a2f2f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family: ui-serif, "Noto Serif TC", "Songti TC", serif; font-size:15px; }
  #app { max-width:880px; margin:0 auto; padding:18px 16px 60px; }
  h1 { font-size:17px; margin:0 0 2px; letter-spacing:2px; }
  .sub { font-size:12px; color:#7c7469; margin-bottom:14px; }
  .panel { border:1px solid var(--line); background:#fffefb; padding:12px 14px; margin-bottom:12px; }
  .enemy { border-left:4px solid var(--accent); }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .name { font-weight:700; letter-spacing:1px; }
  .intent { font-size:13px; color:var(--accent); }
  .stat { font-size:13px; }
  .ban { font-size:12px; color:var(--accent); border:1px dashed var(--accent); padding:1px 6px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:8px; margin:10px 0 14px; }
  .card { border:1px solid var(--line); background:#fffefb; padding:8px 9px; cursor:pointer; text-align:left; font:inherit; }
  .card:hover:not(:disabled) { border-color:var(--accent); }
  .card:disabled { opacity:.42; cursor:default; }
  .card .cost { float:right; font-size:12px; border:1px solid var(--line); padding:0 5px; }
  .card .cname { font-weight:700; }
  .card .ctype { font-size:11px; color:#8a8277; }
  .card .ctext { font-size:12px; color:#5f584e; line-height:1.35; margin-top:3px; }
  .banned { border-color:var(--accent); background:#fbf1ef; }
  button.act { font:inherit; padding:7px 14px; border:1px solid var(--ink); background:#fffefb; cursor:pointer; }
  button.act:hover { background:#efece5; }
  #log { font-size:12.5px; line-height:1.5; max-height:150px; overflow:auto; color:#4b453c; }
  .hint { font-size:11.5px; color:#8a8277; margin-top:10px; }
  .big { font-size:19px; font-weight:700; }
  /* ── 美術層（spike 002/003）── */
  #bgLayer { position:fixed; inset:0; z-index:-1; background:#f4f1e8 center/cover no-repeat;
             opacity:.55; pointer-events:none; }
  #styleBar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:8px 10px; }
  #styleBar button { font:inherit; font-size:12.5px; padding:4px 10px; border:1px solid var(--line); background:#fffefb; cursor:pointer; }
  #styleBar button.on { background:var(--ink); color:#fffefb; border-color:var(--ink); }
  #styleBar .note { font-size:11px; color:#8a8277; }
  .thumb { height:96px; margin:-3px -4px 7px; overflow:hidden; border-bottom:1px solid var(--line); background:#f1eee6; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .portrait { width:88px; height:88px; overflow:hidden; flex:0 0 88px; border:1px solid var(--line); }
  .portrait img { width:100%; height:100%; object-fit:cover; display:block; }
  .enemy-top { display:flex; gap:12px; align-items:center; }
  body.artA { background:#f4f1e8; }
  body.artB { background:#efe9dd; }
  body.artC { background:#f7f7f4; }
  body.artA .card, body.artB .card, body.artC .card { transition:transform .08s ease, box-shadow .12s ease; }
  body.artA .card:hover:not(:disabled), body.artB .card:hover:not(:disabled), body.artC .card:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 3px 8px rgba(0,0,0,.12); }
  .card:active:not(:disabled) { transform:scale(.97); }
  /* ── 打擊動畫 ── */
  @keyframes shakeX { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
  .shake { animation:shakeX .3s ease-in-out; }
  @keyframes slashSweep { 0%{opacity:0;transform:translate(-14px,-10px) rotate(-18deg) scaleX(.4)} 25%{opacity:.95} 100%{opacity:0;transform:translate(14px,10px) rotate(-18deg) scaleX(1.35)} }
  .fx-slash { position:fixed; pointer-events:none; z-index:60;
    background:linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.92) 46%, rgba(122,47,47,.85) 51%, rgba(255,255,255,0) 60%);
    animation:slashSweep .42s ease-out forwards; }
  @keyframes floatUp { 0%{opacity:0;transform:translateY(6px) scale(.8)} 20%{opacity:1;transform:translateY(-4px) scale(1.15)} 100%{opacity:0;transform:translateY(-42px) scale(1)} }
  .fx-num { position:fixed; z-index:70; font-weight:700; font-size:22px; pointer-events:none;
    text-shadow:0 1px 3px rgba(255,255,255,.95); animation:floatUp 1s ease-out forwards; }
  @keyframes ghostFly { 0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)} 100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(-14deg) scale(.42)} }
  .fx-ghost { position:fixed; z-index:65; pointer-events:none; border:1px solid var(--accent); background:#fffefb;
    animation:ghostFly .38s ease-in forwards; overflow:hidden; }
  .fx-ghost img { width:100%; height:100%; object-fit:cover; }
  @keyframes vignette { 0%{opacity:0} 25%{opacity:.5} 100%{opacity:0} }
  .fx-vig { position:fixed; inset:0; z-index:55; pointer-events:none;
    background:radial-gradient(circle at 50% 45%, rgba(255,255,255,0) 35%, rgba(122,47,47,.55) 100%);
    animation:vignette .5s ease-out forwards; }
  @keyframes blockPulse { 0%{background:#eef3ee} 100%{background:#fffefb} }
  .blocked { animation:blockPulse .5s ease-out; }
</style>
</head>
<body>
<div id="bgLayer"></div>
<div id="app">
  <h1>武學對招 — Spike 001 v2</h1>
  <div class="sub">v2 改動：敵人加強、冇免費資源卡、「江湖記憶」升級為針對整個招式類型 ・ <a href="./docs.html" style="color:#7a2f2f">機制與數值文檔 →</a></div>
  <div class="panel" id="styleBar"></div>
  <div id="meta" class="panel"></div>
  <div id="enemy" class="panel enemy"></div>
  <div id="me" class="panel"></div>
  <div id="hand" class="cards"></div>
  <div class="row">
    <button class="act" id="endTurn">結束回合（空白鍵）</button>
    <button class="act" id="restart">重開一局（R）</button>
  </div>
  <div class="panel" style="margin-top:12px"><div id="log"></div></div>
  <div class="hint">按 1–9 出招。重點觀察：亂按會唔會輸、被迫換招時有冇回報。</div>
</div>
<script>
// ── 招式表 ──
// type：劍 / 掌 / 腿 / 內功 —— 「江湖記憶」以類型為單位破招
const CARDS = {
  zhijian:  { name:'直刺',      type:'劍',   cost:1, text:'造成 8 點傷害',                     fx:(c)=>{ hurt(c,8); } },
  hengsao:  { name:'橫掃',      type:'劍',   cost:1, text:'造成 5 點傷害，並使敵人流血 4',      fx:(c)=>{ hurt(c,5); c.bleed += 4; } },
  lianhuan: { name:'連環腿',    type:'腿',   cost:1, text:'造成 5 點傷害 2 次',                 fx:(c)=>{ hurt(c,5); hurt(c,5); } },
  dianxue:  { name:'點穴',      type:'腿',   cost:1, text:'造成 7 點傷害，敵人軟弱 1 回合',     fx:(c)=>{ hurt(c,7); c.weak = Math.max(c.weak,1); } },
  poshi:    { name:'破勢',      type:'掌',   cost:2, text:'造成 18 點傷害，自身受 5 點傷害',    fx:(c)=>{ hurt(c,18); S.hp -= 5; log('破勢反噬，自身受 5 點傷害'); } },
  tuishou:  { name:'推手',      type:'掌',   cost:1, text:'獲得 6 點護體',                      fx:()=>{ S.block += 6; } },
  tuna:     { name:'吐納',      type:'內功', cost:0, text:'抽 1 張牌',                          fx:()=>{ draw(1); } },
  yangqi:   { name:'養氣',      type:'內功', cost:1, text:'獲得 1 點氣，抽 1 張牌',             fx:()=>{ S.energy += 1; draw(1); } },
  yunqi:    { name:'運氣療傷',  type:'內功', cost:1, text:'護體 4，回復 3 點生命',              fx:()=>{ S.block += 4; S.hp = Math.min(S.maxHp, S.hp+3); } },
};
const START_DECK = ['zhijian','zhijian','zhijian','tuishou','tuishou','tuna','lianhuan','dianxue','yunqi','poshi','hengsao','yangqi'];
const ENEMIES = [
  { name:'山賊',   hp:44, hits:2, dmg:7,  note:'兩連擊，護體會被拆開' },
  { name:'鏢師',   hp:56, hits:2, dmg:8,  note:'兩連擊，攻高血厚' },
  { name:'掌門',   hp:68, hits:2, dmg:10, note:'兩連擊，蓄勢時每擊加倍' },
];
const KEY = 'wuxia_spike_001_stats_v2';

// ── 江湖記憶（跨局）：上局最常用「招式類型」被破招 ──
let meta = load();
function load(){
  try { const m = JSON.parse(localStorage.getItem(KEY)); if (m && typeof m.runs === 'number') return m; } catch(e){}
  return { runs:0, wins:0, typeUses:{}, ban:null };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(meta)); } catch(e){} }

let S = null, drawPile = [], LOG = [];
function newRun(){
  LOG = [];
  S = { hp:60, maxHp:60, energy:0, energyMax:3, block:0, turn:0,
        hand:[], discard:[], uses:{}, typeUses:{}, enemy:null, idx:0, over:false };
  drawPile = shuffle(START_DECK.slice());
  log('— 新局開始 —');
  if (meta.ban) log(`江湖記憶：你上局最常用【${meta.ban}】，本局${meta.ban}類招式效果 −30%`);
  startFight(0);
}
function startFight(i){
  const base = ENEMIES[i];
  S.idx = i;
  S.enemy = { name: base.name, hp: base.hp, maxHp: base.hp, dmg: base.dmg, hits: base.hits || 1,
              bleed:0, weak:0, charged:false, note: base.note };
  S.block = 0;
  log(`遇上【${base.name}】(${base.note})`);
  playerTurnStart();
}
function playerTurnStart(){
  S.turn++;
  S.energy = S.energyMax;
  S.block = 0;
  S.typesThisTurn = new Set();
  const e = S.enemy;
  if (e.name === '掌門' && e.hp > e.maxHp/2 && !e.charged && Math.random() < .5) e.charged = true;
  else if (e.weak > 0) e.weak--;
  draw(7);
  render();
}
function draw(n){
  for (let i=0;i<n;i++){
    if (S.hand.length >= 10) return;
    if (drawPile.length === 0){
      if (S.discard.length === 0) return;
      drawPile = shuffle(S.discard); S.discard = [];
      log('洗牌：棄牌堆回到武學譜');
    }
    S.hand.push(drawPile.pop());
  }
}

// ── 行動 ──
function isBanned(type){ return !!type && meta.ban === type; }
function hurt(c, dmg){
  const t = S.lastType;
  let note = '';
  if (isBanned(t)) { dmg = Math.max(1, Math.round(dmg*0.7)); note += '（被破招）'; }
  if (S.typesThisTurn && S.typesThisTurn.size >= 2) { dmg = Math.round(dmg*1.25); note += '（變招 +25%）'; }
  c.hp -= dmg;
  log(`對【${c.name}】造成 ${dmg} 點傷害${note}`);
  if (c.hp <= 0) victory();
}
function playCard(i){
  if (!S || S.over) return;
  const id = S.hand[i]; if (!id) return;
  const card = CARDS[id];
  if (S.energy < card.cost) { log(`氣不足，無法施展【${card.name}】`); return; }
  const handEl = document.getElementById('hand');
  const btn = (handEl && handEl.children) ? handEl.children[i] : null;
  const en = S.enemy, hpBefore = en ? en.hp : 0, blockBefore = S.block, myHpBefore = S.hp;
  S.energy -= card.cost;
  S.hand.splice(i,1); S.discard.push(id);
  S.uses[id] = (S.uses[id]||0)+1;
  S.typeUses[card.type] = (S.typeUses[card.type]||0)+1;
  S.lastType = card.type;
  S.typesThisTurn.add(card.type);
  log(`施展【${card.name}】（${card.type}）`);
  card.fx(S.enemy);
  S.lastType = null;
  // ── 打擊動畫 ──
  fxGhost(btn, id);
  const dealt = hpBefore - Math.max(0, en ? en.hp : 0);
  const gainedBlock = S.block - blockBefore;
  const healed = S.hp - myHpBefore;
  setTimeout(() => {
    if (dealt > 0){ fxSlash(); fxShake(document.getElementById('enemy')); fxNum('-' + dealt, '#7a2f2f', true); }
    if (gainedBlock > 0) fxNum('+' + gainedBlock + ' 護體', '#3f6b46', false);
    if (healed > 0) fxNum('+' + healed, '#3f6b46', false);
  }, 130);
  if (S.hp <= 0) { defeat(); return; }
  render();
}
function endTurn(){
  if (!S || S.over) return;
  S.discard.push(...S.hand); S.hand = [];
  const c = S.enemy;
  if (c.hp <= 0) return;
  if (c.bleed > 0){ c.hp -= c.bleed; log(`【${c.name}】流血受 ${c.bleed} 點傷害`); c.bleed = Math.floor(c.bleed/2); if (c.hp <= 0){ victory(); return; } }
  let base = c.dmg;
  if (c.charged){ base *= 2; c.charged = false; log(`【${c.name}】蓄勢爆發！`); }
  if (c.weak > 0) base = Math.round(base*0.75);
  const hits = c.hits || 1;
  let totalDealt = 0, totalBlocked = 0, detail = [];
  for (let h=0; h<hits; h++){
    const absorbed = Math.min(S.block, base);
    S.block -= absorbed;
    const dealt = base - absorbed;
    S.hp -= dealt;
    totalDealt += dealt; totalBlocked += absorbed;
    detail.push(`${base}${absorbed ? `(擋${absorbed})` : ''}`);
    if (S.hp <= 0) break;
  }
  log(`【${c.name}】${hits}連擊 ${detail.join(' + ')}：共扣 ${totalDealt} 點（護體擋 ${totalBlocked}）`);
  fxVignette();
  fxShake(document.getElementById('me'));
  const meEl = document.getElementById('me');
  if (meEl && meEl.classList && totalBlocked > 0){
    meEl.classList.add('blocked');
    setTimeout(() => meEl.classList.remove('blocked'), 520);
  }
  if (totalDealt > 0) fxNum('-' + totalDealt, '#a33', false);
  if (S.hp <= 0){ defeat(); return; }
  playerTurnStart();
}
function victory(){
  log(`擊敗【${S.enemy.name}】`);
  if (S.idx + 1 < ENEMIES.length){
    S.hp = Math.min(S.maxHp, S.hp + 5);
    log('短暫調息：回復 5 點生命');
    startFight(S.idx+1);
  }
  else endRun(true);
}
function defeat(){ log('你倒下了。'); endRun(false); }
function endRun(win){
  S.over = true;
  meta.runs++; if (win) meta.wins++;
  const top = topType(S.typeUses);
  meta.ban = top;
  for (const k in S.typeUses) meta.typeUses[k] = (meta.typeUses[k]||0) + S.typeUses[k];
  save();
  log(`— 本局結束（${win?'勝':'敗'}）｜你最常用【${top||'—'}】，下一局${top||''}類招式會被破招 —`);
  render();
}
function topType(u){ let b=null,n=0; for (const k in u) if (u[k]>n){ n=u[k]; b=k; } return b; }

// ── 美術層（spike 002）：同一張圖用唔同裁切做測試，未生成正式牌圖 ──
const ART_STYLES = [
  { id:'none', label:'無美術' },
  { id:'A',    label:'水墨' },
  { id:'B',    label:'木刻' },
  { id:'C',    label:'平面' },
];
const CARD_CROP = { zhijian:'18% 12%', hengsao:'62% 26%', lianhuan:'34% 78%', dianxue:'50% 20%',
                    poshi:'70% 55%', tuishou:'44% 48%', tuna:'26% 62%', yangqi:'78% 74%', yunqi:'52% 88%' };
const ENEMY_CROP = { '山賊':'16% 26%', '鏢師':'56% 38%', '掌門':'84% 16%' };
const ENEMY_FILE = { '山賊':'shanzei', '鏢師':'biaoshi', '掌門':'zhangmen' };
const FULL_SET = ['A'];   // 只有水墨有全套正式素材；B/C 暫時用單張圖裁切
let artStyle = 'none';
try { artStyle = localStorage.getItem('wuxia_art_style') || 'none'; } catch(e){}
function saveArt(){ try { localStorage.setItem('wuxia_art_style', artStyle); } catch(e){} }
function artOn(){ return artStyle !== 'none'; }
function artFull(){ return FULL_SET.includes(artStyle); }
function artURL(){ return './art/style' + artStyle + '.webp'; }
function cardArtURL(id){ return artFull() ? './art/A/' + id + '.webp' : artURL(); }
function enemyArtURL(name){ return artFull() ? './art/A/enemy-' + (ENEMY_FILE[name]||'shanzei') + '.webp' : artURL(); }

function renderStyleBar(){
  const bar = document.getElementById('styleBar');
  bar.innerHTML = '';
  bar.children.length = 0;
  const lab = document.createElement('span');
  lab.className = 'note'; lab.textContent = '美術風格：';
  bar.appendChild(lab);
  for (const s of ART_STYLES){
    const b = document.createElement('button');
    b.textContent = s.label + (FULL_SET.includes(s.id) ? '' : '（試）');
    b.className = (artStyle === s.id ? 'on' : '');
    b.onclick = () => { artStyle = s.id; saveArt(); applyArt(); render(); };
    bar.appendChild(b);
  }
  const n = document.createElement('span');
  n.className = 'note';
  n.textContent = artFull() ? '（水墨：正式牌圖 + 敵人圖 + 背景 + 打擊動畫）'
                            : (artOn() ? '（測試用：單張圖裁切，未有正式牌圖）' : '（切換睇下邊種風格順眼）');
  bar.appendChild(n);
}
function applyArt(){
  if (document.body) document.body.className = artOn() ? 'art' + artStyle : '';
  const bg = document.getElementById('bgLayer');
  if (bg && bg.style) bg.style.backgroundImage = artFull() ? `url('./art/A/bg.webp')` : 'none';
}

// ── 打擊動畫（瀏覽器限定；無 DOM 嘅環境會自動 no-op）──
function fxReady(){
  const el = document.getElementById('enemy');
  return !!(el && typeof el.getBoundingClientRect === 'function' && document.body && document.body.appendChild);
}
function fxTemp(cls, css, life){
  const d = document.createElement('div');
  d.className = cls;
  for (const k in css) d.style[k] = css[k];
  document.body.appendChild(d);
  setTimeout(() => { if (d.remove) d.remove(); }, life);
  return d;
}
function fxSlash(){
  if (!fxReady()) return;
  const r = document.getElementById('enemy').getBoundingClientRect();
  fxTemp('fx-slash', { left:(r.left-16)+'px', top:(r.top-10)+'px', width:(r.width+32)+'px', height:(r.height+20)+'px' }, 460);
}
function fxNum(text, color, nearEnemy){
  if (!fxReady()) return;
  const r = (nearEnemy ? document.getElementById('enemy') : document.getElementById('me')).getBoundingClientRect();
  const d = fxTemp('fx-num', { left:(r.left + r.width*0.55)+'px', top:(r.top + 8)+'px', color:color||'#7a2f2f' }, 1050);
  d.textContent = text;
}
function fxGhost(btn, id){
  if (!fxReady() || !btn || typeof btn.getBoundingClientRect !== 'function') return;
  const a = btn.getBoundingClientRect(), b = document.getElementById('enemy').getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'fx-ghost';
  d.style.left = a.left+'px'; d.style.top = a.top+'px';
  d.style.width = Math.min(90, a.width)+'px'; d.style.height = Math.min(110, a.height)+'px';
  d.style.setProperty('--dx', (b.left + b.width/2 - a.left - 45)+'px');
  d.style.setProperty('--dy', (b.top + b.height/2 - a.top - 55)+'px');
  d.innerHTML = `<img src="${cardArtURL(id)}" alt="">`;
  document.body.appendChild(d);
  setTimeout(() => { if (d.remove) d.remove(); }, 420);
}
function fxShake(el){
  if (!fxReady() || !el || !el.classList) return;
  el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 320);
}
function fxVignette(){
  if (!fxReady()) return;
  fxTemp('fx-vig', {}, 520);
}

// ── 畫面 ──
function render(){
  renderStyleBar();
  const e = S.enemy;
  document.getElementById('meta').innerHTML =
    `<div class="row"><span class="stat">局數 <b>${meta.runs}</b>　勝 <b>${meta.wins}</b></span>
     <span class="stat">江湖記憶：${meta.ban ? '<span class="ban">'+meta.ban+'類 −30%</span>' : '（未有記錄）'}</span></div>`;
  document.getElementById('enemy').innerHTML = e ?
    `<div class="enemy-top">
       ${artOn() ? `<div class="portrait"><img src="${enemyArtURL(e.name)}" ${artFull() ? '' : `style="object-position:${ENEMY_CROP[e.name]||'50% 50%'}"`} alt=""></div>` : ''}
       <div style="flex:1">
         <div class="row"><span class="name big">${e.name}</span><span class="stat">生命 ${Math.max(0,e.hp)} / ${e.maxHp}</span></div>
         <div class="row" style="margin-top:6px"><span class="intent">意圖：${e.hp<=0 ? '—' : (e.charged ? '蓄勢（每擊加倍）' : `${e.hits>1?e.hits+'連擊 ':''}攻擊 ${e.weak>0?Math.round(e.dmg*.75):e.dmg}`)}</span>
         <span class="stat">${e.bleed>0 ? '流血 '+e.bleed+'　' : ''}${e.weak>0 ? '軟弱 '+e.weak+' 回合' : ''}</span></div>
       </div>
     </div>` : '';
  document.getElementById('me').innerHTML =
    `<div class="row"><span class="name">你</span><span class="stat">生命 ${Math.max(0,S.hp)} / ${S.maxHp}　護體 ${S.block}　氣 ${S.energy} / ${S.energyMax}</span></div>
     <div class="row" style="margin-top:6px"><span class="stat">變招：本回合已用【${[...(S.typesThisTurn||[])].join('・') || '—'}】${(S.typesThisTurn&&S.typesThisTurn.size>=2) ? '<b>　傷害 +25%</b>' : '（混用 2 種招式類型即 +25% 傷害）'}</span></div>`;
  const hand = document.getElementById('hand');
  hand.innerHTML = ''; hand.children.length = 0;
  S.hand.forEach((id,i)=>{
    const c = CARDS[id];
    const b = document.createElement('button');
    b.className = 'card' + (isBanned(c.type) ? ' banned' : '');
    b.disabled = S.energy < c.cost || S.over || !S.enemy || S.enemy.hp <= 0;
    b.innerHTML = `${artOn() ? `<div class="thumb"><img src="${cardArtURL(id)}" ${artFull() ? '' : `style="object-position:${CARD_CROP[id]||'50% 50%'}"`} alt=""></div>` : ''}<span class="cost">氣 ${c.cost}</span><span class="cname">${c.name}</span> <span class="ctype">${c.type}</span>
                   <div class="ctext">${c.text}${isBanned(c.type) ? '<br><b>被破招 −30%</b>' : ''}</div>`;
    b.onclick = ()=>playCard(i);
    hand.appendChild(b);
  });
  const lg = document.getElementById('log');
  lg.innerHTML = LOG.slice(-40).map(l=>'· '+l).join('<br>');
  lg.scrollTop = lg.scrollHeight;
}
function log(s){ LOG.push(s); }
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

document.getElementById('endTurn').onclick = endTurn;
document.getElementById('restart').onclick = ()=>{ newRun(); render(); };
document.addEventListener('keydown', ev=>{
  if (ev.code === 'Space' || ev.key === 'Enter'){ ev.preventDefault(); endTurn(); }
  else if (ev.key === 'r' || ev.key === 'R'){ newRun(); render(); }
  else if (/^[1-9]$/.test(ev.key)) playCard(parseInt(ev.key,10)-1);
});
// 測試接口（sim 用）
window.spike = { get S(){ return S; }, playCard, endTurn, newRun, meta:()=>meta, CARDS,
                 resetMeta:()=>{ meta = { runs:0, wins:0, typeUses:{}, ban:null }; save(); },
                 setBan:(t)=>{ meta.ban = t; save(); render(); } };

newRun();
applyArt();
render();
</script>
</body>
</html>
